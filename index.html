<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Escape the Maze Cleaning 2D</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="wrap">
    <h1>Escape the Maze Cleaning 2D</h1>
    <div id="hud">
      <span>🧹 Cleaned: <b id="score">0</b>/<b id="total">0</b></span>
      <span>⏱ Time: <b id="time">0</b>s</span>
      <span>❤️ Lives: <b id="lives">3</b></span>
    </div>
    <canvas id="game" width="640" height="640"></canvas>
    <div id="message">Clean all trash, find the key, then escape through the green exit!</div>
    <div id="controls">
      <button id="up">▲</button>
      <div>
        <button id="left">◀</button>
        <button id="down">▼</button>
        <button id="right">▶</button>
      </div>
    </div>
    <button id="restart">Restart Game</button>
    <p class="small">Keyboard: Arrow keys or WASD. Phone: use the buttons.</p>
  </div>
  <script src="game.js"></script>
</body>
</html>
